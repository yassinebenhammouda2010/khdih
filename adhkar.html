        >

        <!-- NAVIGATION -->

        <nav

        >

            <a href="index.html">
                الرئيسية

            <a href="quran.html">

            </a>

            <a href="bukhari.html">

            <a href="adhkar.html">

            <a href="prayer.html">

            <a href="competition.html">
                🏆 مسابقة

            <a href="habits.html">

        <!-- BOUTON DESKTOP -->

        <a

        >
            ابدأ القراءة
        </a>


        <!-- BOUTON MOBILE -->

        <button
            class="menu-toggle"
            id="menu-toggle"
            aria-label="فتح القائمة"
            aria-expanded="false"
        >
            <span></span>
            <span></span>
            <span></span>
        </button>

    </div>

</header>


    <!-- ================= MAIN ================= -->

    <main>


        <!-- ================= HERO ================= -->

        <section class="adhkar-hero">

            <div class="container">

                <h1>
                    الأذكار
                </h1>

                <p>
                    اذكر الله واطمئن قلبك
                </p>

            </div>

        </section>


        <!-- ================= CATÉGORIES ================= -->

        <section class="adhkar-section">

            <div class="container">


                <div class="adhkar-categories">


                    <!-- 1. MORNING -->

                    <button
                        class="category-button active"
                        data-category="morning"
                    >
                        🌅 أذكار الصباح
                    </button>


                    <!-- 2. EVENING -->

                    <button
                        class="category-button"
                        data-category="evening"
                    >
                        🌙 أذكار المساء
                    </button>


                    <!-- 3. AFTER PRAYER -->

                    <button
                        class="category-button"
                        data-category="afterPrayer"
                    >
                        🕌 بعد الصلاة
                    </button>


                    <!-- 4. SLEEP -->

                    <button
                        class="category-button"
                        data-category="sleep"
                    >
                        🌙 أذكار النوم
                    </button>


                    <!-- 5. WAKE UP -->

                    <button
                        class="category-button"
                        data-category="wakeup"
                    >
                        ☀️ أذكار الاستيقاظ
                    </button>


                    <!-- 6. HOME -->

                    <button
                        class="category-button"
                        data-category="home"
                    >
                        🏠 أذكار المنزل
                    </button>


                    <!-- 7. MOSQUE -->

                    <button
                        class="category-button"
                        data-category="mosque"
                    >
                        🕌 أذكار المسجد
                    </button>


                    <!-- 8. FOOD -->

                    <button
                        class="category-button"
                        data-category="food"
                    >
                        🍽️ أذكار الطعام
                    </button>


                    <!-- 9. TRAVEL -->

                    <button
                        class="category-button"
                        data-category="travel"
                    >
                        🚗 أذكار السفر
                    </button>


                    <!-- 10. GENERAL -->

                    <button
                        class="category-button"
                        data-category="general"
                    >
                        📿 أذكار عامة
                    </button>


                </div>


                <!-- ================= LISTE DES ADHKAR ================= -->

                <div
                    id="adhkar-container"
                    class="adhkar-container"
                >

                </div>


            </div>

        </section>

    </main>


    <!-- ================= FOOTER ================= -->

    <footer class="footer">
