<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kihdih | القرآن الكريم</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/quran.css">
</head>

<body>

    <!-- ================= HEADER ================= -->

    <header class="header">

    <div class="container header-content">

        <!-- LOGO -->

        <a
            href="index.html"
            class="logo"
        >
            Kihdih
        </a>


        <!-- NAVIGATION -->

        <nav
            class="navbar"
            id="navbar"
        >

            <a href="index.html">
                الرئيسية
            </a>

            <a href="quran.html">
                القرآن الكريم
            </a>

            <a href="adhkar.html">
                الأذكار
            </a>

            <a href="prayer.html">
                الصلاة
            </a>

        </nav>


        <!-- BOUTON DESKTOP -->

        <a
            href="quran.html"
            class="header-button"
        >
            ابدأ القراءة
        </a>


        <!-- BOUTON MOBILE -->

        <button
            class="menu-toggle"
            id="menu-toggle"
            aria-label="فتح القائمة"
            aria-expanded="false"
        >
            <span></span>
            <span></span>
            <span></span>
        </button>

    </div>

</header>


    <!-- ================= MAIN ================= -->

    <main>

        <!-- Hero Quran -->

        <section class="quran-hero">

            <div class="container">

                <h1>
                    القرآن الكريم
                </h1>

                <p>
                    اقرأ كتاب الله وتدبر آياته
                </p>

            </div>

        </section>


        <!-- Liste des sourates -->

        <section class="surahs-section">

            <div class="container">

                <div class="section-heading">

                    <h2>
                        سور القرآن الكريم
                    </h2>

                    <p>
                        اختر السورة التي تريد قراءتها
                    </p>

                </div>


                <!-- Recherche -->

                <div class="quran-search">

                    <input
                        type="text"
                        id="surah-search"
                        placeholder="ابحث عن سورة..."
                    >

                </div>


                <!-- Sourates -->

                <div
                    class="surahs-grid"
                    id="surahs-container"
                >

                    <!-- JavaScript va ajouter les sourates ici -->

                </div>

            </div>

        </section>

    </main>


    <!-- ================= FOOTER ================= -->

    <footer class="footer">

        <div class="container">

            <p>
                © 2026 Kihdih - موقع إسلامي
            </p>

        </div>

    </footer>


    <script src="js/quran.js"></script>
    <script src="js/menu.js"></script>

</body>

</html>
