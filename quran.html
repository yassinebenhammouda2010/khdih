<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kihdih | القرآن الكريم</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/quran.css">
</head>

<body>

    <!-- ================= HEADER ================= -->

    <header class="header">

        <div class="container header-content">

            <a href="index.html" class="logo">
                Kihdih
            </a>

            <nav class="navbar" id="navbar">

                <a href="index.html">
                    الرئيسية
                </a>

                <a href="quran.html">
                    القرآن الكريم
                </a>

                <a href="bukhari.html">
                    صحيح البخاري
                </a>

                <a href="adhkar.html">
                    الأذكار
                </a>

                <a href="prayer.html">
                    الصلاة
                </a>

                <a href="aya.html">
                    آية لك
                </a>

                <a href="competition.html">
                    🏆 مسابقة
                </a>

                <a href="habits.html">
                    📿 عاداتي
                </a>

            </nav>

            <a href="quran.html" class="header-button">
                ابدأ القراءة
            </a>

            <button
                class="menu-toggle"
                id="menu-toggle"
                aria-label="فتح القائمة"
                aria-expanded="false"
                type="button"
            >
                <span></span>
                <span></span>
                <span></span>
            </button>

        </div>

    </header>


    <!-- ================= MAIN ================= -->

    <main>

        <!-- HERO -->

        <section class="quran-hero">

            <div class="container">

                <h1>
                    القرآن الكريم
                </h1>

                <p>
                    اقرأ كتاب الله وتدبر آياته
                </p>

            </div>

        </section>


        <!-- ================= SURAHS ================= -->

        <section class="surahs-section">

            <div class="container">

                <div class="section-heading">

                    <h2>
                        سور القرآن الكريم
                    </h2>

                    <p>
                        اختر السورة التي تريد قراءتها، أو ابحث عن آية بكلماتها
                    </p>

                </div>


                <!-- SEARCH -->

                <div class="quran-search">

                    <input
                        type="text"
                        id="surah-search"
                        placeholder="ابحث عن اسم سورة، أو عن كلمات من آية..."
                        autocomplete="off"
                    >

                </div>


                <!-- AYAH SEARCH RESULTS -->

                <div
                    id="ayah-search-results"
                    class="ayah-search-results hidden"
                ></div>


                <!-- RECITER -->

                <div class="reciter-select-row">

                    <label for="reciter-select">
                        🎙️ اختر القارئ:
                    </label>

                    <select id="reciter-select">
                    </select>

                </div>


                <!-- SURAHS GRID -->

                <div
                    class="surahs-grid"
                    id="surahs-container"
                >

                    <p class="loading">
                        جاري تحميل سور القرآن...
                    </p>

                </div>

            </div>

        </section>

    </main>


    <!-- ================= MINI PLAYER ================= -->

    <div
        id="mini-player"
        class="mini-player hidden"
    >

        <div class="mini-player-info">

            <span id="mini-player-surah">
                —
            </span>

            <span
                id="mini-player-reciter"
                class="mini-player-reciter"
            >
                —
            </span>

        </div>


        <div class="mini-player-progress-bg">

            <div
                id="mini-player-progress"
                class="mini-player-progress-fill"
            ></div>

        </div>


        <div class="mini-player-controls">

            <button
                id="mini-player-toggle"
                aria-label="تشغيل / إيقاف"
                type="button"
            >
                ▶️
            </button>

            <button
                id="mini-player-close"
                aria-label="إغلاق"
                type="button"
            >
                ✕
            </button>

        </div>

    </div>


    <!-- ================= FOOTER ================= -->

    <footer class="footer">

        <div class="container">

            <p>
                © 2026 Kihdih - موقع إسلامي
            </p>

        </div>

    </footer>


    <script src="js/quran.js"></script>
    <script src="js/menu.js"></script>

</body>

</html>
