<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kihdih | قراءة السورة</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/surah.css">
</head>

<body>

    <!-- HEADER -->
    <header class="header">

        <div class="container header-content">

            <a href="index.html" class="logo">
                Kihdih
            </a>

            <nav class="navbar" id="navbar">

                <a href="index.html">الرئيسية</a>

                <a href="quran.html">القرآن الكريم</a>

                <a href="bukhari.html">صحيح البخاري</a>

                <a href="adhkar.html">الأذكار</a>

                <a href="prayer.html">الصلاة</a>

                <a href="aya.html">آية لك</a>

                <a href="competition.html">🏆 مسابقة</a>

                <a href="habits.html">📿 عاداتي</a>

            </nav>

            <a href="quran.html" class="header-button">
                القرآن الكريم
            </a>

            <button
                class="menu-toggle"
                id="menu-toggle"
                aria-label="فتح القائمة"
                aria-expanded="false"
                type="button"
            >
                <span></span>
                <span></span>
                <span></span>
            </button>

        </div>

    </header>


    <!-- MAIN -->
    <main>

        <section class="surah-reading">

            <div class="container">

                <!-- SURAH HEADER -->
                <div class="surah-header">

                    <h1 id="surah-name">
                        جاري التحميل...
                    </h1>

                    <p id="surah-info">
                        جاري تحميل السورة...
                    </p>

                </div>


                <!-- NAVIGATION -->
                <div class="surah-navigation">

                    <button
                        id="previous-surah"
                        type="button"
                    >
                        → السورة السابقة
                    </button>

                    <a
                        href="quran.html"
                        class="back-to-quran"
                    >
                        القرآن الكريم
                    </a>

                    <button
                        id="next-surah"
                        type="button"
                    >
                        السورة التالية ←
                    </button>

                </div>


                <!-- TILAWAH TOOLBAR -->
                <div class="ayah-tilawah-hint">

                    💡 اضغط على رقم الآية للاستماع إليها وحدها.

                </div>

                <div class="tilawah-toolbar">

                    <div class="reciter-select-row">

                        <label for="reciter-select">
                            🎙️ القارئ:
                        </label>

                        <select id="reciter-select">
                        </select>

                    </div>

                    <div class="tilawah-buttons">

                        <button
                            id="play-full-surah"
                            class="tilawah-button"
                            type="button"
                        >
                            🔊 تشغيل السورة كاملة
                        </button>

                        <button
                            id="toggle-range-mode"
                            class="tilawah-button"
                            type="button"
                        >
                            🎯 تحديد آية البداية والنهاية
                        </button>

                        <button
                            id="cancel-range-mode"
                            class="tilawah-button tilawah-button-ghost hidden"
                            type="button"
                        >
                            ✕ إلغاء التحديد
                        </button>

                    </div>

                    <p id="range-mode-hint" class="range-mode-hint hidden">
                        اضغط على رقم آية البداية، ثم رقم آية النهاية
                    </p>

                </div>


                <!-- AYAH CONTAINER -->
                <div
                    id="ayahs-container"
                    class="ayahs-container"
                >

                    <p class="loading">
                        جاري تحميل الآيات...
                    </p>

                </div>

            </div>

        </section>

    </main>


    <!-- ================= PLAYER BAR ================= -->

    <div
        id="surah-player"
        class="surah-player hidden"
    >

        <div class="surah-player-info">

            <span id="player-ayah">—</span>

            <span
                id="player-reciter"
                class="surah-player-reciter"
            >
                —
            </span>

        </div>


        <div class="surah-player-progress-bg">

            <div
                id="player-progress"
                class="surah-player-progress-fill"
            ></div>

        </div>


        <div class="surah-player-controls">

            <button
                id="player-pause"
                type="button"
                aria-label="تشغيل / إيقاف"
            >
                ⏸
            </button>

            <button
                id="player-stop"
                type="button"
                aria-label="إيقاف كامل"
            >
                ⏹
            </button>

        </div>

    </div>


    <!-- FOOTER -->
    <footer class="footer">

        <div class="container">

            <p>
                © 2026 Kihdih - موقع إسلامي
            </p>

        </div>

    </footer>


    <script src="js/surah.js"></script>
    <script src="js/menu.js"></script>

</body>

</html>
