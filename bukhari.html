        const gridEl = document.getElementById("bukhari-books");
        const countEl = document.getElementById("bukhari-count");
        const searchEl = document.getElementById("bukhari-search");

        function renderBooks(list) {

            if (list.length === 0) {
                gridEl.innerHTML = `<div class="bukhari-empty">لم يتم العثور على أي كتاب مطابق</div>`;
                countEl.textContent = "0 كتاب";
                return;
            }

            gridEl.innerHTML = list.map(([num, arabic, chapters, hadiths]) => `
                <a href="bukhari-book.html?book=${num}" class="bukhari-card">

                    <div class="book-number">
                        ${num}
                    </div>

                    <div>
                        <h3>${arabic}</h3>
                        <p>${chapters} بابًا</p>
                        <p class="book-count">${hadiths} حديثًا</p>
                    </div>

                </a>
            `).join("");

            countEl.textContent = `${list.length} كتابًا من أصل ${BUKHARI_BOOKS.length}`;

        }

        renderBooks(BUKHARI_BOOKS);

        searchEl.addEventListener("input", () => {

            const query = searchEl.value.trim();

            if (!query) {
                renderBooks(BUKHARI_BOOKS);
                return;
            }

            const filtered = BUKHARI_BOOKS.filter(([num, arabic]) => {
                return arabic.includes(query) || String(num) === query;
            });

            renderBooks(filtered);

        });
